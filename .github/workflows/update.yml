# 每日自動更新：抓近幾天新賽果 → 產靜態站 → commit 資料 → 部署 GitHub Pages
name: daily-update

on:
  schedule:
    - cron: "10 14 * * *"   # 每日 14:10 UTC = 23:10 JST（當天賽果多已上傳）
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 抓近 7 天：牌組碼常延遲公開，重抓最近一週才補得到；已解析過的牌組有快取不會重打
      - name: 抓近 7 天新賽果（僅排程時；push 只重新產站）
        if: github.event_name != 'push'
        run: python scrape_meta.py --days 7

      - name: 產靜態站（含補抓新卡圖）
        run: python build_site.py

      - name: commit 資料庫與卡圖快取（有變更才 commit）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sve_meta.db img_cache
          git diff --cached --quiet || git commit -m "data: 每日自動更新 $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
